left_arm_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - left_joint1
    - left_joint2
    - left_joint3
    - left_joint4
    - left_joint5
    - left_joint6
    - left_joint7
  constraints:
    goal_time: 5.0
    stopped_velocity_tolerance: 0.5
    left_joint1: { trajectory: 0.08, goal: 0.05 }
    left_joint2: { trajectory: 0.08, goal: 0.05 }
    left_joint3: { trajectory: 0.08, goal: 0.05 }
    left_joint4: { trajectory: 0.08, goal: 0.05 }
    left_joint5: { trajectory: 0.08, goal: 0.05 }
    left_joint6: { trajectory: 0.08, goal: 0.05 }
    left_joint7: { trajectory: 0.08, goal: 0.05 }
  gains:
    left_joint1:
      p: 1000
      d: 1
      i: 1
      i_clamp: 1
    left_joint2:
      p: 1000
      d: 1
      i: 1
      i_clamp: 1
    left_joint3:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    left_joint4:
      p: 100
      d: 1
      i: 1
      i_clamp: 1
    left_joint5:
      p: 100
      d: 1
      i: 0.5
      i_clamp: 1
    left_joint6:
      p: 50
      d: 1
      i: 0.5
      i_clamp: 1
    left_joint7:
      p: 50
      d: 1
      i: 0.5
      i_clamp: 1
