common:
  speed:
    slowly: &SLOWLY
      speed: 0.3
      accel: 0.1
      timeout: 15.
    normally: &NORMALLY
      speed: 0.5
      accel: 0.4
      timeout: 6.
    quickly: &QUICKLY
      speed: 0.8
      accel: 0.6
      timeout: 5.
    maximum: &MAXIMUM
      speed: 1.0
      accel: 1.0
      timeout: 4.

  tolerance:
    small_tolerance: &SMALL_TOLERANCE
      tolerance_joints: [ 0.005, 0.02, 0.01, 0.02, 0.02, 0.02, 0.02 ]
    normal_tolerance: &NORMAL_TOLERANCE
      tolerance_joints: [ 0.012, 0.03, 0.03, 0.04, 0.04, 0.03, 0.03 ]
    bigger_tolerance: &BIGGER_TOLERANCE
      tolerance_joints: [ 0.015, 0.05, 0.06, 0.08, 0.06, 0.07, 0.05 ]
    max_tolerance: &MAX_TOLERANCE
      tolerance_joints: [ 0.02, 0.08, 0.07, 0.1, 0.07, 0.07, 0.06 ]

  joint1:
    home: &JOINT1_HOME_POS
      0.121

  joint2:
    home: &JOINT2_HOME_POS
      1.553

  joint3:
    home: &JOINT3_HOME_POS
      -1.06

  joint4:
    home: &JOINT4_HOME_POS
      1.007

  joint5:
    home: &JOINT5_HOME_POS
      -0.033

  joint6:
    home: &JOINT6_HOME_POS
      0.197

  joint7:
    home: &JOINT7_HOME_POS
      0.0001

  arm:
    home: &HOME
      joints: [ *JOINT1_HOME_POS, *JOINT2_HOME_POS, *JOINT3_HOME_POS, *JOINT4_HOME_POS, *JOINT5_HOME_POS, *JOINT6_HOME_POS,  *JOINT7_HOME_POS]
      common:
        <<: *NORMALLY
      tolerance:
        <<: *NORMAL_TOLERANCE
    ready_assemble: &READY_ASSEMBLE
      joints: [ 0.43, 0.001, *JOINT3_HOME_POS, *JOINT4_HOME_POS, *JOINT5_HOME_POS, *JOINT6_HOME_POS,  *JOINT7_HOME_POS ]
      common:
        <<: *NORMALLY
      tolerance:
        <<: *BIGGER_TOLERANCE

  gimbal:
    right_pos: &RIGHT_POS
      frame: base_link
      position: [ 0.00 , -3., 0. ]
    left_pos: &LEFT_POS
      frame: base_link
      position: [ 0.001, 3., 0. ]
    front_pos: &FRONT_POS
      frame: base_link
      position: [ 3., -0.3, 0. ]
    back_pos: &BACK_POS
      frame: base_link
      position: [ -3., -0.3, 0. ]
    follow_ee: &FOLLOW_EE
      frame: gripper_link
      position: [ 0.20, 0.00, 0. ]

  gripper:
    open_gripper: &OPEN_GRIPPER
      command: false
    clode_gripper: &CLOSE_GRIPPER
      command: true


  chassis:
    chassis_left: &CHASSIS_LEFT_30
      frame: base_link
      position: [ 0.0, 0.30 ]
      yaw: 0.0
      chassis_tolerance_position: 0.05
      chassis_tolerance_angular: 0.1
      common:
        timeout: 6.
#    chassis_left_60: &CHASSIS_LEFT_70
#      frame: base_link
#      position: [ 0.0, 0.7 ]
#      yaw: 0.0
#      chassis_tolerance_position: 0.1
#      chassis_tolerance_angular: 0.2
#      common:
