  GIMBAL_F:
    - step: "gimbal look front"
      gimbal:
        <<: *FRONT_POS

  GIMBAL_R:
    - step: "gimbal look right"
      gimbal:
        <<: *RIGHT_POS

  GIMBAL_B:
    - step: "gimbal look back"
      gimbal:
        <<: *BACK_POS
  GIMBAL_EE:
    - step: "gimbal follow ee"
      gimbal:
        <<: *FOLLOW_EE

  CALIBRATION:
    - step: "gimbal look front"
      gimbal:
        <<: *FRONT_POS

  HOME:
    - step: "arm home pos"
      arm:
        <<: *HOME
#    - step: "gripper open"
#      gripper:
#        <<: *OPEN_GRIPPER
#    - step: "gimbal look front"
#      gimbal:
#        <<: *FRONT_POS

  LIFTER_INIT:
    - step: "lifter init"
      lifter:
        state: 0
  LIFTER_UP:
    - step: "lifter up"
      lifter:
        state: 1
  LIFTER_UP0:
    - step: "lifter init"
      lifter:
        state: 0
  LIFTER_DOWN:
    - step: "lifter down"
      lifter:
        state: 2
