      right_gripper:
        <<: *OPEN_GRIPPER

  GRIPPER_CLOSE:
    - step: "grippers close"
      left_gripper:
        <<: *CLOSE_GRIPPER
      right_gripper:
        <<: *CLOSE_GRIPPER
