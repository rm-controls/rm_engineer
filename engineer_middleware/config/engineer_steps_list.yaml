#      yaw: -1.07
#      chassis_tolerance_position: 0.1
#      chassis_tolerance_angular: 0.2
#      common:
#        timeout: 6.
    chassis_turn_back: &CHASSIS_TURN_BACK
      frame: base_link
      position: [ 0.0, 0.0 ]
      yaw: 3.14
      chassis_tolerance_position: 0.1
      chassis_tolerance_angular: 0.2
      common:
        timeout: 2.

steps_list:
  GIMBAL_BACK:
    - step: "gimbal move to back pos"
      arms:
        <<: *GIMBAL_BACK
        common:
          <<: *QUICKLY
        tolerance:
          <<: *NORMAL_TOLERANCE

  GIMBAL_MID:
    - step: "gimbal move to mid pos"
      arms:
        <<: *GIMBAL_MID
        common:
          <<: *QUICKLY
        tolerance:
          <<: *NORMAL_TOLERANCE

  GIMBAL_FRONT:
    - step: "gimbal move to front pos"
      arms:
        <<: *GIMBAL_FRONT
        common:
          <<: *QUICKLY
        tolerance:
          <<: *NORMAL_TOLERANCE

  GIMBAL_PACK_UP:
    - step: "gimbal pack up"
      arms:
        <<: *GIMBAL_PACK_UP
        common:
          <<: *QUICKLY
        tolerance:
          <<: *NORMAL_TOLERANCE

  GIMBAL_LOOK_DOWN:
    - step: "gimbal look down"
      arms:
        <<: *GIMBAL_LOOK_DOWN
        common:
          <<: *QUICKLY
        tolerance:
          <<: *NORMAL_TOLERANCE

  _GIMBAL_BACK:
    - step: "gimbal move to back pos"
      arms:
        <<: *GIMBAL_BACK
        common:
          <<: *QUICKLY
        tolerance:
          <<: *NORMAL_TOLERANCE

  _GIMBAL_MID:
