common:
  speed:
    slowly: &SLOWLY
      speed: 0.1
      accel: 0.1
      timeout: 9.
    normally: &NORMALLY
      speed: 0.5
      accel: 0.4
      timeout: 6.
    quickly: &QUICKLY
      speed: 0.8
      accel: 0.6
      timeout: 5.
    maximum: &MAXIMUM
      speed: 1.0
      accel: 1.0
      timeout: 4.

  tolerance:
    # gimbal_arm/left_arm/right_arm
    # main_pitch/gimbal_joint1/2/3/left_joint1/2/3/4/5/6/7/right_joint1/2/3/4/5/6/7
    small_tolerance: &SMALL_TOLERANCE
      tolerance_joints: [ 0.05, 0.01, 0.01, 0.01,
                          0.08, 0.05, 0.03, 0.04, 0.01, 0.01, 0.01,
                          0.08, 0.05, 0.03, 0.04, 0.01, 0.01, 0.01 ]
    normal_tolerance: &NORMAL_TOLERANCE
      tolerance_joints: [ 0.08, 0.03, 0.03, 0.03,
                          0.1, 0.08, 0.06, 0.08, 0.03, 0.03, 0.03,
                          0.1, 0.08, 0.06, 0.08, 0.03, 0.03, 0.03 ]
    bigger_tolerance: &BIGGER_TOLERANCE
      tolerance_joints: [ 0.1, 0.05, 0.05, 0.05,
                          0.15, 0.1, 0.08, 0.1, 0.06, 0.05, 0.06,
                          0.15, 0.1, 0.08, 0.1, 0.06, 0.05, 0.06 ]
    max_tolerance: &MAX_TOLERANCE
      tolerance_joints: [ 0.2, 0.08, 0.08, 0.08,
                          0.2, 0.15, 0.1, 0.12, 0.08, 0.07, 0.07,
                          0.2, 0.15, 0.1, 0.12, 0.08, 0.07, 0.07 ]


  gimbal:
    mid_pos: &GIMBAL_MID
      groups:
        - gimbal_arm: [ 0.0, 0.0, 0.0, 0.0 ]
    pack_up: &GIMBAL_PACK_UP
      groups:
        - gimbal_arm: [ "KEEP", -0.048, 0.647, 1.184 ]
    front_pos: &GIMBAL_FRONT
      groups:
        - gimbal_arm: [ 0.0, 0.0, 0.0, 0.0 ]
    back_pos: &GIMBAL_BACK
      groups:
        - gimbal_arm: [ 0.175, -1.177, -0.667, 2.085 ]
    look_down: &GIMBAL_LOOK_DOWN
      groups:
        - gimbal_arm: [ 0.175, -0.786, -0.366, 2.111 ]

  left_gripper:
    open_gripper: &OPEN_GRIPPER
      command: false
    close_gripper: &CLOSE_GRIPPER
      command: true

  right_gripper:
    open_gripper: &OPEN_GRIPPER
      command: false
    close_gripper: &CLOSE_GRIPPER
      command: true


  chassis:
    chassis_left: &CHASSIS_LEFT_30
      frame: base_link
      position: [ 0.0, 0.30 ]
      yaw: 0.0
      chassis_tolerance_position: 0.05
      chassis_tolerance_angular: 0.1
      common:
        timeout: 6.
#    chassis_left_60: &CHASSIS_LEFT_70
#      frame: base_link
#      position: [ 0.0, 0.7 ]
#      yaw: 0.0
#      chassis_tolerance_position: 0.1
#      chassis_tolerance_angular: 0.2
#      common:
#        timeout: 6.
#    chassis_left60: &CHASSIS_LEFT_60
#      frame: base_link
#      position: [ 0.0, 0.6 ]
#      yaw: 0.0
#      chassis_tolerance_position: 0.1
#      chassis_tolerance_angular: 0.2
#      common:
#        timeout: 6.
#    chassis_left50: &CHASSIS_LEFT_50
#      frame: base_link
#      position: [ 0.0, 0.5 ]
#      yaw: 0.0
#      chassis_tolerance_position: 0.1
#      chassis_tolerance_angular: 0.2
#      common:
#        timeout: 6.
#    chassis_back_60: &CHASSIS_BACK_60
#      frame: base_link
#      position: [ -0.6, 0.0 ]
#      yaw: 0.0
#      chassis_tolerance_position: 0.1
#      chassis_tolerance_angular: 0.2
#      common:
#        timeout: 6.
#    chassis_turn_left: &CHASSIS_TURN_LEFT
#      frame: base_link
#      position: [ 0.0, 0.0 ]
#      yaw: 1.57
#      chassis_tolerance_position: 0.1
#      chassis_tolerance_angular: 0.2
#      common:
#        timeout: 6.
#    chassis_turn_right: &CHASSIS_TURN_RIGHT
#      frame: base_link
